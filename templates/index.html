<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pipeline Pulse</title>

    <link rel="stylesheet" href="/static/style.css">

    <script
        src="https://unpkg.com/htmx.org@2.0.4"
        defer>
    </script>
</head>

<body>

    <main class="container">
        <h1>Pipeline Pulse</h1>

        <p>
            A simple project for learning CI/CD and GitHub Actions.
        </p>

        <button
            hx-get="/health"
            hx-target="#result"
            hx-swap="innerHTML">
            Check Backend
        </button>

        <div id="result">
            Backend status will appear here.
        </div>
    </main>

</body>
</html>
